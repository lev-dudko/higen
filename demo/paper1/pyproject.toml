[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper1_demo"
version = "1.0.0"
description = "GATr-lite demo for tWb vs t-tbar separation (companion to higen paper 1)."
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Edward Boos" },
  { name = "Lev Dudko" },
  { name = "Petr Volkov" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "h5py>=3.9",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
ref-root = ["uproot>=5"]
tensorboard = ["tensorboard>=2.13"]

[tool.setuptools.packages.find]
include = ["paper1_demo*"]
